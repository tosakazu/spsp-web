# spsp.games の外形監視 (tools/monitor/check.mjs)。1 時間おき (GitHub の schedule)。失敗すると GitHub がメールで知らせる (スケジュールを最後に変更した人に届く)。
# 公開リポジトリは 60 日 push が無いとスケジュール実行が止まるので、そのときは Actions の画面から再度有効にする。
name: monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node tools/monitor/check.mjs
