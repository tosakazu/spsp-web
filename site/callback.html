<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.callback.title">処理中 — SPSP</title>
<meta name="robots" content="noindex">

<!--
  INV-8: このページには外部リソースを一切置かない。
  アナリティクス (nav.js が読み込む gtag) / CDN / 画像 / Web フォント すべて禁止。
  URL に認可コードが載った状態で読み込まれるページなので、
  referrer も送らない。CSP でも機械的に縛っている。
-->
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">

<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
    background: #ffffff; color: #111827; font-size: 14px;
  }
  .cb { max-width: 460px; margin: 64px auto; padding: 0 16px; }
  .cb-title { font-size: 16px; font-weight: 700; margin: 0 0 6px; }
  .cb-detail { color: #6b7280; font-size: 13px; margin: 0 0 14px; line-height: 1.7; }
  .cb-back { color: #2563eb; font-size: 13px; }
  .cb-retry { display: block; margin: 0 0 12px; height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: #111827; color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .cb-retry:disabled { opacity: .6; }
  .cb.error .cb-title { color: #991b1b; }
  /* 処理中: SPSP のロゴ (再生) と「ログイン中…」を真ん中に。ロゴの CSS は同じサイトの logo.css を <style> にして入れる (INV-8) */
  .cb-busy { text-align: center; }
  .cb-logo { max-width: 280px; margin: 0 auto 14px; }
  .cb-busy .cb-title { color: #6b7280; font-weight: 600; }
</style>
</head>
<body>
<div id="cb-root" class="cb cb-busy">
  <div class="cb-logo" id="cb-logo"></div>
  <p class="cb-title" id="cb-busy-msg">処理中…</p>
</div>

<script src="region/config.js"></script>
<script src="i18n/ja.js"></script>
<script src="region/i18n.js"></script>
<script src="assets/callback.js"></script>
</body>
</html>
