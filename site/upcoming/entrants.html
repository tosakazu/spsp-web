<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.upcoming.title">今後の大会 — SPSP</title>
<meta name="description" content="これから開かれるスマブラSP の大会と参加予定者。使い手・地域・実力順・実力分布で見られる。" data-i18n-attr="content:page.upcoming.description">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SPSP">
<meta property="og:title" content="SPSP 今後の大会" data-i18n-attr="content:page.upcoming.og_title">
<meta property="og:description" content="これから開かれるスマブラSP の大会と参加予定者" data-i18n-attr="content:page.upcoming.og_description">
<link rel="stylesheet" href="../css/player.css">
<link rel="stylesheet" href="../ranking-table.css">
<style>
/* 大会ページ (t/index.html) と同じ見た目: ここから「今後の大会だけの追加」の手前までは t/index.html の <style> と同じ */

  main { max-width: 480px; margin: 0 auto; padding: 16px; }

  /* Hero */
  .hero .name-row {
    display: flex; align-items: flex-start; gap: 8px; justify-content: space-between;
  }
  .hero .name {
    font-size: 22px; font-weight: 700; color: #111827;
    line-height: 1.25; word-break: break-word;
    flex: 1;
  }
  .hero .event {
    font-size: 13px; color: #6b7280; margin-top: 4px;
  }
  .hero .meta-line {
    margin-top: 8px; font-size: 12px; color: #374151;
  }
  .hero .meta-line .chip {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    background: #f3f4f6; font-size: 11px; margin-right: 4px;
  }
  .hero .meta-line .chip.wk { background: #dbeafe; color: #1e40af; }
  .hero .meta-line .chip.wd { background: #f3f4f6; color: #6b7280; }
  .hero .meta-line .chip.sm { background: #fef3c7; color: #92400e; }
  .hero .meta-line .chip.pre { background: #f3e8ff; color: #6b21a8; }
  .hero .meta-line .chip.res { background: #ffe4e6; color: #be123c; }
  .hero .meta-line .chip.lc  { background: #e0f2fe; color: #0369a1; }
  .hero .meta-line .chip.rs  { background: #f3f4f6; color: #4b5563; }
  .hero .meta-line .chip.gf  { background: #ffedd5; color: #9a3412; font-weight: 600; }
  .chip.resume { background: #dbeafe; color: #1d4ed8; font-weight: 600; }


  /* Sections — player page と同じスタイル */
  /* tour-item (player page と統一): 左 place 列 + center meta + 右 value */
  .tour-item {
    display: grid; grid-template-columns: 46px 1fr auto;
    gap: 10px; padding: 8px 0; border-bottom: 1px solid #f3f4f6;
    align-items: center; transition: background 0.1s;
  }
  .tour-item:hover { background: #f3f4f6; }
  .tour-item .meta { font-size: 12px; color: #374151; min-width: 0; word-break: break-word; }
  .tour-item .meta a { color: #dc2626; text-decoration: none; font-weight: 500; font-size: 13px; }
  .tour-item .meta .sub { color: #9ca3af; font-size: 10px; margin-top: 1px; }
  .tour-item .v {
    text-align: center; font-variant-numeric: tabular-nums; font-weight: 700;
    color: #16a34a; font-size: 18px; line-height: 1.1; min-width: 56px;
  }
  .tour-item .v .frac { display: block; font-size: 10px; color: #9ca3af; font-weight: 400; }
  .tour-item .v.dim { color: #9ca3af; }

  /* match-row (アップセット用): プレイヤー名 score 相手名 — player page と統一 */
  .match-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 0; font-size: 12px; line-height: 1.4;
    border-bottom: 1px solid #f3f4f6; transition: background 0.1s;
  }
  .match-row:last-child { border-bottom: none; }
  .match-row:hover { background: #f3f4f6; }
  .match-row .m-content {
    flex: 1 1 auto; display: flex; align-items: baseline;
    justify-content: center; gap: 8px; min-width: 0;
  }
  .match-row .m-player { text-align: right; color: #374151; }
  .match-row .m-opp { text-align: left; color: #374151; }
  .match-row a { color: #dc2626; text-decoration: none; font-weight: 500; }
  .match-row a:hover { text-decoration: underline; }
  .match-row .m-seed { display: block; color: #9ca3af; font-size: 10px; line-height: 1.2; margin-top: 1px; }
  .match-row .m-score {
    font-weight: 700; font-variant-numeric: tabular-nums; font-size: 16px; flex: 0 0 auto;
    text-align: center;
  }
  .match-row .m-uf {
    flex: 0 0 60px; text-align: center;
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .match-row .m-uf .num { display: block; font-size: 18px; font-weight: 700; color: #16a34a; }
  .match-row .m-uf .frac { display: block; font-size: 10px; color: #9ca3af; font-weight: 400; }

  /* Pager (prev/next + page indicator) — player page と統一 */

  /* Standings 検索 */
  .std-note { font-size: 11px; color: #6b7280; margin: -4px 0 6px; }
  .standings-controls { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .standings-controls input {
    flex: 1; min-width: 120px;
    padding: 7px 10px;
    background: #f9fafb; color: #111827;
    border: 1px solid #e5e7eb; border-radius: 6px;
    font-size: 12px; font-family: inherit;
  }

  /* クリックで展開する大会内 match list (standings の各 entry 下) */
  .tour-group { border-bottom: 1px solid #f3f4f6; }
  .tour-group .tour-item { border-bottom: none; cursor: pointer; transition: background 0.1s; }
  .tour-group .tour-item:hover { background: #f3f4f6; }
  .tour-group .tour-item .meta a { transition: color 0.1s; }
  .tour-group .tour-item .meta a:hover { color: #b91c1c; text-decoration: underline; }
  .tour-group .chevron {
    color: #d1d5db; font-size: 10px; margin-left: 4px;
    transition: transform 0.15s;
  }
  .match-row.t-match {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 12px; font-size: 12px; line-height: 1.4;
    border-bottom: none;
  }
  .match-row.t-match:hover { background: #f3f4f6; }
  .match-row.t-match .m-bracket {
    flex: 0 0 68px; font-size: 10px; color: #9ca3af; text-align: left; white-space: nowrap;
  }
  .match-row.t-match .m-content {
    flex: 1 1 auto; display: flex; align-items: baseline; justify-content: center; gap: 8px; min-width: 0;
  }
  .match-row.t-match .m-player, .match-row.t-match .m-opp {
    flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .match-row.t-match .m-player { text-align: right; }
  .match-row.t-match .m-opp { text-align: left; }
  .match-row.t-match .m-score { font-weight: 700; font-size: 13px; flex: 0 0 auto; text-align: center; min-width: 36px; }
  .match-row.t-match .m-delta {
    flex: 0 0 56px; text-align: right;
    font-variant-numeric: tabular-nums; font-size: 11px;
  }

  /* Standings: tour-item ベース + v-stats chips (player page と統一) */
  /* 各行を固定高さ + flex 中央寄せにして、Latin/CJK の font-size 差で行間がズレないようにする. */
  .v-stats .chip .lbl {
    display: flex; align-items: center; justify-content: center;
    height: 12px; font-size: 9px; color: #9ca3af; letter-spacing: 0.04em; white-space: nowrap;
  }

  /* Share */

  .empty-msg { text-align: center; color: #6b7280; padding: 24px 16px; font-size: 13px; }

  /* 展開ブロック冒頭の "PlayerName #seed" ヘッダー (= モバイル match-row で本人名を省略する代わり) */

  /* ─── 全順位表 (= tour-group 内) 専用 2 列カード形式 (PC/スマホ共通) ───
     他セクション (順位上昇 / 直対上昇 / アップセット 等) はデフォルトレイアウトのまま. */
  .tour-group .tour-item {
    grid-template-columns: 50px 1fr;
    grid-template-rows: auto auto;
    column-gap: 8px; row-gap: 4px;
    padding: 8px 6px;
  }
  .tour-group .tour-item .place { grid-column: 1; grid-row: 1 / span 2; align-self: center; }
  .tour-group .tour-item .meta { grid-column: 2; grid-row: 1; }
  .tour-group .tour-item .v-stats {
    grid-column: 2; grid-row: 2;
    justify-self: stretch; justify-content: center;
    flex-wrap: wrap; gap: 14px;
    position: relative; padding-right: 22px;
  }

  /* match-row.t-match (大会内マッチ展開時, PC/スマホ共通): 主役名 (m-player) は省略,
     bracket は左に残す. bracket は固定幅 (= 大会内で score 列の x 座標が揃うように). */
  .match-row.t-match { gap: 6px; padding: 4px 8px; }
  .match-row.t-match .m-bracket {
    flex: 0 0 56px; font-size: 10px; color: #9ca3af;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .match-row.t-match .m-content {
    flex: 1 1 auto; display: flex; align-items: center;
    justify-content: flex-start; gap: 6px; min-width: 0;
  }
  .match-row.t-match .m-player { display: none; }
  /* スコアの列は詰めて、その分を相手の名前に回す */
  .match-row.t-match .m-score {
    flex: 0 0 auto; text-align: left; min-width: 30px;
    font-size: 13px; font-weight: 700;
  }
  .match-row.t-match .m-opp {
    flex: 1 1 0; text-align: left; min-width: 0;
    overflow-wrap: anywhere; line-height: 1.3;   /* 長い名前は省略せず折り返す */
  }
  .match-row.t-match .m-delta { flex: 0 0 auto; min-width: 50px; }

  /* ─── モバイル (max-width: 720px) ─── */

  /* ── 今後の大会だけの追加 ── */
  .up-back { display: inline-block; font-size: 12px; color: #6b7280; text-decoration: none; margin: 0 0 10px; }
  .up-back:hover { color: #dc2626; }
  .section h2 .cnt { color: #9ca3af; font-weight: 400; margin-left: 6px; }
  .tour-item .meta .nm { color: #111827; font-weight: 500; font-size: 13px; }
  .tour-item .v.rk { color: #374151; }
  .tour-item.up-g { cursor: pointer; }
  .tour-matches .tour-item { cursor: default; padding-left: 10px; }
  .standings-controls select {
    flex: 1; min-width: 110px; padding: 7px 10px; background: #f9fafb; color: #111827;
    border: 1px solid #e5e7eb; border-radius: 6px; font-size: 12px; font-family: inherit;
  }
  .v-stats .chip .val { white-space: nowrap; }
  /* 分布: 横棒 (1 色。数は棒の右) */
  .up-dist h3 { font-size: 11px; color: #6b7280; font-weight: 600; margin: 10px 0 6px; }
  .up-bars { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 8px; font-size: 12px; }
  /* 1 帯 = 1 行。列の幅は外の grid に揃える (subgrid)。古いブラウザは決まった幅 */
  .up-row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; column-gap: 8px; }
  @supports not (grid-template-columns: subgrid) { .up-row { grid-template-columns: 150px 1fr 78px; } }
  .up-bars .lb { color: #374151; white-space: nowrap; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
  .up-bars .lb small { color: #9ca3af; font-size: 10px; }
  /* Lv のバッジ (プレイヤーページ p/index.html と同じ) */
  .lv-pill {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 700; line-height: 1.4;
    background: #e5e7eb; color: #6b7280; letter-spacing: 0.04em;
  }
  .lv-pill.lv-5 { background: #fef3c7; color: #92400e; }
  .lv-pill.lv-4 { background: #ede9fe; color: #6b21a8; }
  .lv-pill.lv-3 { background: #dbeafe; color: #1d4ed8; }
  .lv-pill.lv-2 { background: #dcfce7; color: #15803d; }
  .lv-pill.lv-1 { background: #f3f4f6; color: #6b7280; }
  .lv-pill.lv-0 { background: #f9fafb; color: #9ca3af; }
  .up-bars .bar { height: 12px; background: #f3f4f6; border-radius: 3px; overflow: hidden; }
  .up-bars .bar i { display: block; height: 100%; background: #dc2626; border-radius: 3px; }
  .up-bars .bar.none i { background: #9ca3af; }
  .up-bars .n { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; text-align: right; }
  .up-bars .n small { font-weight: 400; color: #9ca3af; margin-left: 6px; font-size: 10px; }
  /* 予選通過のライン: 掛かる帯の行ごと色、札は行の 2 段目。ラインの外側の棒は薄く */
  .up-bars .bar { display: flex; }
  .up-bars .bar i.out { background: #fecaca; }
  .up-bars .bar.none i.out { background: #e5e7eb; }
  .up-bars .bar i + i.out { border-radius: 0 3px 3px 0; }
  .up-row.cut { background: #fffbeb; border-radius: 8px; padding: 6px; margin: 0 -6px; row-gap: 5px; }
  .up-row.cut .up-cut-tag { grid-column: 1 / -1; justify-self: start; }
  .up-cut-tag { font-size: 10px; font-weight: 700; color: #92400e; background: #fde68a; border-radius: 8px; padding: 1px 6px; white-space: nowrap; }

  /* 使い手の選択 (キャラ投票 vote.html のキャラ選択と同じ形。人数つき) */
  .up-char-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .up-char-tools input[type="search"] { flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 13px; font-family: inherit; }
  #up-char-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 8px; max-height: 330px; overflow-y: auto; padding: 1px;
  }
  .vt-char {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 2px 6px; background: #fff; color: #111827; font-weight: 400;
    border: 1px solid #d1d5db; border-radius: 10px; font-family: inherit; cursor: pointer;
  }
  .vt-char:hover { border-color: #93c5fd; background: #f8fbff; }
  .vt-char .em { font-size: 24px; line-height: 1.1; }
  .vt-char .nm { font-size: 10px; color: #6b7280; line-height: 1.25; text-align: center; }
  .vt-char .ct { font-size: 10px; color: #9ca3af; font-variant-numeric: tabular-nums; line-height: 1; }
  .vt-char.sel { border: 2px solid #2563eb; background: #eff6ff; padding: 7px 1px 5px; }
  .vt-char.sel .nm { color: #1d4ed8; font-weight: 700; }

  /* 参加予定者の表 (ランキングのページと同じ: css/site.css・css/detail.css の該当部分 + ranking-table.css) */
  .header { max-width: 1400px; margin: 0 auto; padding: 8px 24px 0; }
  .header h2 { font-size: 16px; color: #111827; margin: 0 0 4px; }
  .header h2 .cnt { font-size: 12px; color: #9ca3af; font-weight: 400; margin-left: 6px; }
  .header .subtitle { font-size: 12px; color: #6b7280; margin: 0 0 4px; }
  .status { color: #6b7280; font-size: 12px; }
  .table-wrap { max-width: 1400px; margin: 0 auto; padding: 0 24px 32px; }
  .method-tabs {
    display: inline-flex; gap: 4px; padding: 4px; background: #f9fafb;
    border: 1px solid #e5e7eb; border-radius: 10px; margin: 8px 0;
  }
  .method-tab {
    padding: 8px 14px; border-radius: 7px; cursor: pointer; user-select: none;
    font-size: 13px; font-weight: 600; color: #6b7280; text-align: center; line-height: 1.2;
  }
  .method-tab:hover { color: #374151; background: #f3f4f6; }
  .method-tab.active { background: #dc2626; color: #fff; }
  .method-tab .tab-desc { display: block; font-size: 10px; opacity: 0.7; margin-top: 2px; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 8px 0 12px; }
  .controls input[type="search"], .controls select { padding: 8px 12px; border: 1px solid #e5e7eb; background: #fff; color: #111827; border-radius: 6px; font-size: 13px; font-family: inherit; }
  .controls input[type="search"] { min-width: 280px; }
  .view-opt { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #9ca3af; cursor: pointer; user-select: none; }
  .view-opt input { margin: 0; width: 12px; height: 12px; accent-color: #9ca3af; }
  .view-opt:hover { color: #6b7280; }
  .up-char-btn { padding: 8px 12px; border: 1px solid #e5e7eb; background: #fff; color: #111827; border-radius: 6px; font-size: 13px; font-family: inherit; cursor: pointer; }
  .up-char-btn:hover, .up-char-btn[aria-expanded="true"] { border-color: #93c5fd; background: #f8fbff; }
  .up-char-panel { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin: 0 0 12px; background: #fff; }
  .up-filter-chip { display: none; align-items: center; gap: 4px; font-size: 12px; padding: 4px 10px; border-radius: 14px; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; cursor: pointer; font-family: inherit; }
  .up-filter-chip.on { display: inline-flex; }
  /* シード・ウェーブ・プールの列 (公開されている大会だけ)。スマホは 3 段目の 1 行 (col-up-m) に */
  #ranktable th.col-up, #ranktable td.col-up { text-align: center; white-space: nowrap; font-size: 12px; color: #374151; font-variant-numeric: tabular-nums; }
  #ranktable th.col-up-m, #ranktable td.col-up-m { display: none; }
  .up-pool-a { color: #2563eb; text-decoration: none; }
  .up-pool-a:hover { text-decoration: underline; }
  @media (max-width: 720px) {
    #ranktable tr.main-row td.col-up { display: none !important; }
    #ranktable tr.main-row td.col-up-m { display: block; grid-column: 2 / -1; grid-row: 3; font-size: 11px; color: #6b7280; margin-top: 3px; }
    #ranktable tr.main-row td.col-up-m:empty { display: none; }
    .col-up-m .sep { margin: 0 6px; color: #d1d5db; }
    .header { padding: 8px 12px 0; }
    .table-wrap { padding: 0 8px 24px; max-width: 100vw; overflow-x: hidden; }
    .method-tabs { padding: 2px; gap: 2px; }
    .method-tab { padding: 6px 8px; font-size: 11px; }
    .method-tab .tab-desc { display: none; }
    .controls { gap: 6px; }
    .controls input[type="search"] { min-width: 0; flex: 1 1 100%; }
  }
</style>
<link rel="stylesheet" href="../region/site.css">
</head>
<body>

<div id="nav-root"></div>
<script src="../region/config.js"></script>
<script src="../i18n/ja.js"></script>
<script src="../region/i18n.js"></script>

<!-- 今後の大会の参加予定者 (?e=<event id>)。大会ページ (t/) と同じ形。中身は src/pages/upcoming_entrants.js -->
<main>
  <div id="loading" class="empty-msg" data-i18n="common.loading">読み込み中…</div>
  <div id="not-found" class="empty-msg" style="display:none"></div>

  <div id="share-card" style="display:none">
    <a class="up-back" id="up-back" href="./" data-i18n="upcoming.back">← 今後の大会の一覧</a>
    <div class="hero">
      <div class="name-row">
        <div class="name" id="name">—</div>
        <a class="share-icon-btn" id="startgg-link" target="_blank" rel="noopener" title="start.gg" aria-label="start.gg" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6"></path>
            <path d="M10 14L21 3"></path>
            <path d="M21 14v7H3V3h7"></path>
          </svg>
        </a>
      </div>
      <div class="event" id="event">—</div>
      <div class="meta-line" id="meta-line"></div>
    </div>


    <div class="section">
      <h2 data-i18n="upcoming.sec.dist">📊 実力分布</h2>
      <div class="up-dist" id="up-dist"></div>
    </div>

    <div class="section">
      <h2><span data-i18n="upcoming.sec.pref">🗾 地域</span><span class="cnt" id="up-pref-n"></span></h2>
      <div class="pager" id="up-prefs-pager" style="display:none"></div>
      <div id="up-prefs"></div>
    </div>

    <div class="section">
      <h2><span data-i18n="upcoming.sec.char">🎮 使い手</span><span class="cnt" id="up-char-n"></span></h2>
      <div class="std-note"><label class="view-opt"><input type="checkbox" id="up-sub2"> <span data-i18n="upcoming.include_sub">サブ使用も含める</span></label></div>
      <div class="pager" id="up-chars-pager" style="display:none"></div>
      <div id="up-chars"></div>
    </div>
  </div>
</main>

<!-- 参加予定者 (ランキングのページと同じ表。src/pages/upcoming_entrants.js が js/ranking_page.js で作る) -->
<div id="up-rank" style="display:none">
  <div class="header">
    <h2><span data-i18n="upcoming.sec.rank">📋 参加予定者</span><span class="cnt" id="up-rank-n"></span></h2>
    <div class="method-tabs" id="method-tabs">
      <div class="method-tab active" data-method="ensemble" data-i18n="ranking.tab.ensemble">総合評価<span class="tab-desc" data-i18n="ranking.tab.ensemble_desc">推奨</span></div>
      <div class="method-tab" data-method="tjpr" data-i18n="ranking.tab.tjpr">順位評価<span class="tab-desc" data-i18n="ranking.tab.tjpr_desc_short">大会順位ベース</span></div>
      <div class="method-tab" data-method="bt_gated" data-i18n="ranking.tab.bt">直対評価<span class="tab-desc" data-i18n="ranking.tab.bt_desc_short">直接対決ベース</span></div>
    </div>
    <div class="controls">
      <input type="search" id="search" placeholder="プレイヤー名で検索…" autocomplete="off" data-i18n-attr="placeholder:ranking.search_placeholder">
      <label class="view-opt"><input type="checkbox" id="search-by-id"> <span data-i18n="ranking.search_by_id">ID検索</span></label>
      <select id="up-fpref" aria-label="地域" data-i18n-attr="aria-label:upcoming.all_prefs"></select>
      <select id="up-fpool" aria-label="プール" data-i18n-attr="aria-label:upcoming.col.pool" hidden></select>
      <button type="button" class="up-char-btn" id="up-char-btn" aria-expanded="false" aria-controls="up-char-panel" data-i18n="upcoming.char_pick">🎮 キャラ選択</button>
      <button type="button" class="up-filter-chip" id="up-char-chip"></button>
    </div>
    <!-- キャラ選択 (キャラ投票 vote.html と同じ形)。「キャラ選択」を押すと開く -->
    <div class="up-char-panel" id="up-char-panel" hidden>
      <div class="up-char-tools">
        <input id="up-char-search" type="search" placeholder="キャラ名で入力して絞り込み" autocomplete="off" data-i18n-attr="placeholder:upcoming.char_search">
        <label class="view-opt"><input type="checkbox" id="up-sub"> <span data-i18n="upcoming.include_sub">サブ使用も含める</span></label>
      </div>
      <div id="up-char-grid"></div>
    </div>
  </div>
  <div class="table-wrap">
    <table id="ranktable">
      <tbody id="tbody">
        <tr><td colspan="11" class="empty-msg" data-i18n="common.loading">読み込み中…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="footer" id="footer-info" style="max-width:480px;margin:0 auto;padding:0 16px 24px">
  <span data-i18n="upcoming.note">順位・Lv・使用キャラ・地域は SPSP の集計によるものです。参加予定者は start.gg の登録にもとづき、1 日に何度か更新します。</span>
</div>

<script src="../assets/upcoming_entrants.js"></script>
</body>
</html>
