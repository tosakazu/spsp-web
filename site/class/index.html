<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.class.title">下位クラス作成 | SPSP</title>
<meta name="description" content="start.gg の本戦の結果から、下位クラス (Bクラス・Cクラスなど) のトーナメントを Challonge に作ります。" data-i18n-attr="content:page.class.description">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../css/class_bracket.css">
<link rel="stylesheet" href="../region/site.css">
</head>
<body>

<div id="nav-root"></div>
<script src="../region/config.js"></script>
<script src="../i18n/ja.js"></script>
<script src="../region/i18n.js"></script>

<!-- 下位クラス作成 (docs/class_bracket_design.md)。見た目は優先枠作成・シード機能に合わせる。
     start.gg のキーは「保存」を押したときだけブラウザに保存 (シード機能と共通)。SPSP のサーバには保存しない -->
<main class="cb-main">
  <h1 data-i18n="class.title">下位クラス作成</h1>
  <p class="subtitle" data-i18n="page.class.description">start.gg の本戦の結果から、下位クラス (Bクラス・Cクラスなど) のトーナメントを Challonge に作ります。</p>

  <div class="cb-card">
    <!-- 1. アカウント -->
    <div class="cb-sec">
      <h2 data-i18n="class.h.accounts">アカウント</h2>
      <label class="cb-label" for="cb-sgg-key">
        <span data-i18n="class.startgg_key">start.gg の API キー (その大会の管理者)</span>
        <a class="cb-help-link" href="https://start.gg/admin/profile/developer" target="_blank" rel="noopener" data-i18n="seed.skeleton.t8">API キー取得→</a>
      </label>
      <div class="cb-token">
        <input type="password" id="cb-sgg-key" placeholder="xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
        <button type="button" class="cb-icon-btn" id="cb-sgg-reveal" data-i18n-attr="title:seed.skeleton.t116" title="表示/隠す">👁</button>
        <button type="button" class="cb-save-btn" id="cb-sgg-save" data-i18n-attr="title:seed.skeleton.t117" title="ブラウザに保存" data-i18n="seed.skeleton.t9">💾 保存</button>
      </div>
      <div class="cb-hint" id="cb-sgg-hint"></div>

      <div class="cb-label"><span data-i18n="class.challonge">Challonge</span></div>
      <div class="cb-connect">
        <span class="cb-connect-state" id="cb-ch-state"></span>
        <button type="button" class="cb-sub-btn" id="cb-ch-login" data-i18n="class.challonge_login">Challonge でログイン</button>
      </div>
    </div>

    <!-- 2. 本戦 -->
    <div class="cb-sec">
      <h2 data-i18n="class.h.main">本戦</h2>
      <!-- キーで管理できる大会 (開催中を先頭)。選ぶと URL に入る -->
      <div id="cb-tour-pick-row" hidden>
        <label class="cb-label" for="cb-tour-pick" data-i18n="class.tour_pick">管理している大会から選ぶ</label>
        <select id="cb-tour-pick"></select>
      </div>
      <label class="cb-label" for="cb-event" data-i18n="class.event_url">本戦の start.gg の URL (大会のページでも可)</label>
      <input type="text" id="cb-event" placeholder="https://www.start.gg/tournament/…" autocomplete="off">
      <!-- 大会にイベントが複数あるときだけ出す -->
      <div id="cb-event-pick-row" hidden>
        <label class="cb-label" for="cb-event-pick" data-i18n="class.event_pick">イベント</label>
        <select id="cb-event-pick"></select>
      </div>
    </div>

    <button type="button" class="cb-main-btn" id="cb-load" data-i18n="class.load">読み込む</button>
    <div class="cb-status" id="cb-status" role="status"></div>

    <!-- 3. 設定 (読み込んだあとに出す。本戦の順位・DQ の有無から候補を作る。変えるとすぐ一覧に反映) -->
    <div class="cb-sec" id="cb-settings" hidden>
      <h2 data-i18n="class.h.settings">設定</h2>
      <!-- 集計対象にするか: 一番大事なので設定の一番上に、目立つ枠で -->
      <label class="cb-counted" for="cb-counted">
        <input type="checkbox" id="cb-counted" checked>
        <span class="cb-counted-text">
          <strong data-i18n="class.counted">SPSP の集計対象にする</strong>
          <span class="cb-counted-note" data-i18n="class.counted_note">チェックすると、終わったあと SPSP のランキングに入ります</span>
        </span>
      </label>
      <div class="cb-grid">
        <div>
          <label class="cb-label" for="cb-letter" data-i18n="class.letter">クラス</label>
          <select id="cb-letter">
            <option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="E">E</option>
          </select>
        </div>
        <div>
          <label class="cb-label" for="cb-format" data-i18n="class.format">形式</label>
          <select id="cb-format">
            <option value="single" data-i18n="class.format.single">シングルエリミネーション</option>
            <option value="double" data-i18n="class.format.double">ダブルエリミネーション</option>
          </select>
        </div>
        <div>
          <label class="cb-label" for="cb-place-min" data-i18n="class.range">対象の順位</label>
          <div class="cb-range">
            <select id="cb-place-min"></select>
            <span data-i18n="class.range_to">位 〜</span>
            <select id="cb-place-max"></select>
          </div>
        </div>
        <div>
          <label class="cb-label" for="cb-seeding" data-i18n="class.seeding">シード</label>
          <select id="cb-seeding">
            <option value="main_spsp" data-i18n="class.seeding.main_spsp">本戦の結果 (同率は SPSP の順位)</option>
            <option value="main_result" data-i18n="class.seeding.main_result">本戦の結果 (同率はランダム)</option>
            <option value="spsp" data-i18n="class.seeding.spsp">SPSP の順位</option>
            <option value="random" data-i18n="class.seeding.random">ランダム</option>
          </select>
        </div>
      </div>
      <!-- 被り回避: シード機能の「🔀 被り回避最適化」と同じ項目 + 本戦で当たった人を避ける (既定 ON) -->
      <details class="cb-avoid" open>
        <summary><strong data-i18n="seed.skeleton.t29">🔀 被り回避最適化</strong>
          <span class="cb-avoid-desc" data-i18n="class.avoid_desc">地域被り・直接対戦・本戦で当たった組が序盤で当たらないよう、作成するときにシード順を並べ替えます。</span></summary>
        <div class="cb-avoid-opts">
          <label data-i18n-attr="title:seed.skeleton.t122" title="同じ地域の選手が同じプール・早期回戦に固まらないよう分散する"><input type="checkbox" id="cb-av-region" checked> <span data-i18n="seed.skeleton.t36">地域被りを考慮</span></label>
          <label data-i18n-attr="title:seed.skeleton.t123" title="直近に対戦した相手と再び早期に当たるのを避ける"><input type="checkbox" id="cb-av-recent" checked> <span data-i18n="seed.skeleton.t37">直接対戦を考慮</span></label>
          <label data-i18n-attr="title:class.avoid_main_help" title="本戦で対戦した相手と、早い回戦で再び当たるのを避ける (直接対戦より強く)"><input type="checkbox" id="cb-av-main" checked> <span data-i18n="class.avoid_main">本戦で当たった人を避ける</span></label>
          <label data-i18n-attr="title:seed.skeleton.t126" title="平日扱いの大会での対戦も「直接対戦」に含める"><input type="checkbox" id="cb-av-weekday"> <span data-i18n="seed.skeleton.t40">平日大会を含む</span></label>
          <span id="cb-av-groups" class="cb-av-groups"></span>
        </div>
      </details>
    </div>


    <!-- 読み込んだら: 対象の選手とシード順 (チェックを外した人は入れない)。確かめてから作成 -->
    <div class="cb-sec" id="cb-preview" hidden>
      <h2 id="cb-preview-title"></h2>
      <!-- 名前で検索・出る人 / 出ない人 / DQ で絞る (表示だけ。シードは変わらない)。DQ の人は最初は外してある -->
      <div class="cb-filter">
        <input type="search" id="cb-search" data-i18n-attr="placeholder:class.search" placeholder="プレイヤー名で検索…" autocomplete="off">
        <div class="cb-seg" id="cb-seg">
          <button type="button" data-f="all" class="on"></button><button type="button" data-f="on"></button><button type="button" data-f="off"></button><button type="button" data-f="dq" hidden></button>
        </div>
      </div>
      <div class="cb-table-wrap">
        <table class="cb-table" id="cb-table">
          <thead><tr>
            <th class="col-on"></th>
            <th class="col-no" data-i18n="class.col.seed">シード</th>
            <th data-i18n="class.col.player">プレイヤー</th>
            <th class="col-place" data-i18n="class.col.main">本戦</th>
          </tr></thead>
          <tbody id="cb-list"></tbody>
        </table>
      </div>
      <button type="button" class="cb-main-btn" id="cb-create" data-i18n="class.create">Challonge に作成</button>
    </div>

    <div class="cb-done" id="cb-done" hidden>
      <div class="cb-done-title" data-i18n="class.done">作成しました</div>
      <a id="cb-done-link" target="_blank" rel="noopener"></a>
    </div>
  </div>

  <!-- 作成した下位クラス (間違えたら削除できる。取り込み済みは削除できない) -->
  <div class="cb-card cb-mine" id="cb-mine" hidden>
    <h2 data-i18n="class.h.mine">作成した下位クラス</h2>
    <ul class="cb-mine-list" id="cb-mine-list"></ul>
    <div class="cb-status" id="cb-mine-status" role="status"></div>
  </div>
</main>

<script src="../assets/class.js"></script>
</body>
</html>
