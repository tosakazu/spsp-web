<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page.news.title">お知らせ — SPSP</title>
<meta name="description" content="SPSP の速報 (エンタメ自動通知) と運営からの通知一覧。" data-i18n-attr="content:page.news.description">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
    background: #ffffff; color: #111827; font-size: 14px;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; color: #111827; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
  .filter-tabs {
    display: flex; gap: 4px; margin: 12px 0 24px;
    background: #ffffff; padding: 4px; border-radius: 8px;
    border: 1px solid #e5e7eb; width: max-content; max-width: 100%;
    overflow-x: auto;
  }
  .filter-tab {
    padding: 6px 14px; cursor: pointer; border-radius: 6px;
    font-size: 13px; color: #6b7280; transition: all 0.1s;
    user-select: none; white-space: nowrap;
  }
  .filter-tab:hover { color: #374151; background: #f3f4f6; }
  .filter-tab.active { background: #dc2626; color: #fff; }
  .news-list { display: flex; flex-direction: column; gap: 12px; }
  .news-card {
    border: 1px solid #e5e7eb; border-radius: 8px;
    padding: 16px; background: #ffffff;
    transition: border-color .15s, box-shadow .15s;
  }
  .news-card:hover { border-color: #d1d5db; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .news-card .meta-row {
    display: flex; gap: 10px; align-items: center; margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .news-card .date {
    font-size: 12px; color: #6b7280; font-family: ui-monospace, monospace;
  }
  .news-card .type-badge {
    font-size: 10px; padding: 2px 8px; border-radius: 4px;
    font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .news-card .type-badge.auto {
    background: #dbeafe; color: #1e40af;
  }
  .news-card .type-badge.announcement {
    background: #fef3c7; color: #92400e;
  }
  .news-card .title {
    font-size: 15px; font-weight: 600; color: #111827; margin: 0 0 6px;
    line-height: 1.4;
  }
  .news-card .body {
    font-size: 13px; color: #4b5563; line-height: 1.6; margin: 0;
    white-space: pre-wrap;  /* \n を改行として表示 */
  }
  .news-card .signature {
    text-align: right; font-size: 12px; color: #6b7280;
    margin-top: 14px; line-height: 1.6; white-space: pre-wrap;
  }
  .empty-msg {
    color: #9ca3af; font-size: 13px; padding: 24px; text-align: center;
  }
  @media (max-width: 720px) {
    .container { padding: 16px; }
    h1 { font-size: 18px; }
    .news-card { padding: 12px; }
  }
</style>
<link rel="stylesheet" href="../region/site.css">
</head>
<body>

<div id="nav-root"></div>
<script src="../region/config.js"></script>
<script src="../i18n/ja.js"></script>
<script src="../region/i18n.js"></script>

<div class="container">
  <h1 data-i18n="nav.news_aria">お知らせ</h1>

  <div class="filter-tabs" id="filter-tabs">
    <div class="filter-tab active" data-filter="all" data-i18n="common.all">すべて</div>
    <div class="filter-tab" data-filter="auto" data-i18n="nav.news.auto">📢 速報</div>
    <div class="filter-tab" data-filter="announcement" data-i18n="nav.news.announcement">📌 通知</div>
  </div>

  <div class="news-list" id="news-list">
    <div class="empty-msg" data-i18n="common.loading">読み込み中…</div>
  </div>
</div>

<script src="../assets/news.js"></script>
</body>
</html>
