<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.me.title">マイページ | SPSP</title>
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; background: #fff; color: #111827; font-size: 14px; }
  .me { max-width: 420px; margin: 64px auto; padding: 0 16px; text-align: center; }
  .me-msg { color: #6b7280; font-size: 13px; line-height: 1.7; margin: 0 0 16px; }
  .me-login { height: 42px; padding: 0 20px; border: 0; border-radius: 10px; background: #111827; color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .me-login:disabled { opacity: .6; }
</style>
<link rel="stylesheet" href="region/site.css">
</head>
<body>
<div id="nav-root"></div>
<script src="region/config.js"></script>
<script src="i18n/ja.js"></script>
<script src="region/i18n.js"></script>

<!-- 自分のプレイヤーページへの共通リンク (spsp.games/jp/me)。ログイン中ならすぐ移る。ログアウト中はログインしてから (src/pages/me.js) -->
<main class="me">
  <div id="loading" class="empty-msg" data-i18n="common.loading">読み込み中…</div>
  <div id="me-gate" style="display:none">
    <p class="me-msg" id="me-msg" data-i18n="me.login_needed">自分のプレイヤーページを開くには、start.gg でログインしてください。</p>
    <button type="button" class="me-login" id="me-login-btn" data-i18n="card_edit.login">start.gg でログイン</button>
  </div>
</main>

<script src="assets/me.js"></script>
</body>
</html>
