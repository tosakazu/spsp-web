<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.p_badges.title">裏面のバッジ | SPSP</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../css/player.css">
<link rel="stylesheet" href="../css/player_card.css">
<link rel="stylesheet" href="../css/holo_badge.css">
<link rel="stylesheet" href="../css/badge_edit.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@500;600;700&family=Zalando+Sans+Expanded:ital,wght@0,400;0,500;0,600;0,700;1,800&family=Zalando+Sans:ital,wght@0,500..900;1,900&display=swap">
<link rel="stylesheet" href="../region/site.css">
</head>
<body>

<div id="nav-root"></div>
<script src="../region/config.js"></script>
<script src="../i18n/ja.js"></script>
<script src="../region/i18n.js"></script>

<!-- カードの裏面に実績バッジを付ける (試作。あとでカード編集に入れる)。中身は src/pages/p_badges.js
     付けたものはこのブラウザにだけ残す (サーバには送らない) -->
<main class="bz">
  <div id="loading" class="empty-msg" data-i18n="common.loading">読み込み中…</div>
  <div id="not-found" class="empty-msg" style="display:none" data-i18n="player.not_found">プレイヤーが見つかりません。URL を確認してください。</div>

  <div id="bz-root" style="display:none">
    <a class="bz-back" id="bz-back" href="./">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      <span>マイページに戻る</span>
    </a>
    <h1 class="bz-title">裏面のバッジ <span class="bz-tag">試作</span></h1>

    <!-- 裏面の上に付ける層 (カードと同じ 514×333 の座標、表示幅に合わせて縮める) -->
    <div class="bz-top">
      <div class="bz-stage" id="bz-stage">
        <div class="pcard pcard-back" id="bz-card" aria-hidden="true"></div>
        <div class="bz-layer" id="bz-layer"></div>
        <div class="bz-over" id="bz-over"><div class="bz-frame" id="bz-frame" style="display:none"><span class="bz-h bz-h-rot" title="回転・大きさ">↻</span><span class="bz-h bz-h-del" title="外す">×</span></div></div>
      </div>

      <!-- 選んでいるバッジの操作 (選んでいないときは使い方) -->
      <div class="bz-tools" id="bz-tools">
        <div class="bz-hint" id="bz-hint">下の一覧から押すとカードに付けられます。付けたバッジは、ドラッグで移動、角の ↻ で回転と大きさ (2 本指でも可)。</div>
        <div class="bz-sel" id="bz-sel" style="display:none">
          <div class="bz-sel-name" id="bz-sel-name"></div>
          <label class="bz-range"><span>大きさ</span><input type="range" id="bz-size" min="0" max="1000" step="1"><output id="bz-size-v"></output></label>
          <label class="bz-range"><span>回転</span><input type="range" id="bz-rot" min="-180" max="180" step="1"><output id="bz-rot-v"></output></label>
          <div class="bz-btns">
            <button type="button" id="bz-up" title="1 つ上へ">上へ</button>
            <button type="button" id="bz-down" title="1 つ下へ">下へ</button>
            <button type="button" id="bz-front">いちばん上</button>
            <button type="button" id="bz-backmost">いちばん下</button>
            <button type="button" id="bz-reset-tf">回転を戻す</button>
            <button type="button" class="bz-del" id="bz-del">外す</button>
          </div>
        </div>
      </div>
    </div>

    <section class="bz-sec">
      <h2>持っているバッジ <span class="bz-count" id="bz-count"></span></h2>
      <div class="bz-note">色は仮のルールです (優勝 = 虹、2・3 位 = 金、ほか = 銀)。アイコンのある大会だけ出ます。</div>
      <div class="bz-filters" id="bz-filters">
        <button type="button" data-f="all" class="on">全部</button>
        <button type="button" data-f="win">優勝</button>
        <button type="button" data-f="top3">3 位以内</button>
        <button type="button" data-f="placed">付けたもの</button>
      </div>
      <div class="bz-tray" id="bz-tray"></div>
      <button type="button" class="bz-more" id="bz-more" style="display:none">もっと見る</button>
    </section>

    <div class="bz-bar">
      <button type="button" class="bz-clear" id="bz-clear">全部外す</button>
      <span class="bz-saved">このブラウザにだけ保存されます</span>
    </div>
  </div>
</main>

<script src="../assets/p_badges.js"></script>
</body>
</html>
