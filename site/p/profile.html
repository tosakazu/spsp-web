<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.p_profile.title">プロフィール編集 | SPSP</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../css/player.css">
<link rel="stylesheet" href="../css/card_edit.css">
<style>
  .pf { max-width: 560px; margin: 0 auto; padding: 12px 16px 56px; }
  .pf h1 { font-size: 20px; font-weight: 700; margin: 4px 0 2px; }
  .pf-name { color: #6b7280; font-size: 13px; margin: 0 0 18px; overflow-wrap: anywhere; }
  .pf-sec { border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 16px; margin: 0 0 12px; background: #fff; }
  .pf-sec h2 { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin: 0 0 6px; }
  .pf-sec p { font-size: 13px; line-height: 1.7; color: #4b5563; margin: 0 0 10px; }
  .pf-chip { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: #f3f4f6; color: #6b7280; }
  .pf-chip.on { background: #dcfce7; color: #166534; }
  .pf-go { display: inline-flex; align-items: center; height: 38px; padding: 0 16px; border-radius: 10px; background: #111827; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
  .pf-go:hover { background: #374151; }
  .pf-go:focus-visible, .pf-switch input:focus-visible + .pf-track { outline: 2px solid #111827; outline-offset: 2px; }
  /* 切り替え: 文字の行ごと押せる (44px 以上) */
  .pf-switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 44px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .pf-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .pf-track { flex: 0 0 auto; position: relative; width: 46px; height: 26px; border-radius: 999px; background: #d1d5db; transition: background .15s; }
  .pf-track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
  .pf-switch input:checked + .pf-track { background: #111827; }
  .pf-switch input:checked + .pf-track::after { transform: translateX(20px); }
  .pf-switch input:disabled + .pf-track { opacity: .5; }
  .pf-status { min-height: 18px; font-size: 12px; color: #166534; margin-top: 2px; }
  .pf-status.bad { color: #b91c1c; }
  .pf-note { font-size: 12px; color: #6b7280; margin: 6px 0 0; }
  @media (prefers-reduced-motion: reduce) { .pf-track, .pf-track::after { transition: none; } }
</style>
<link rel="stylesheet" href="../region/site.css">
</head>
<body>

<div id="nav-root"></div>
<script src="../region/config.js"></script>
<script src="../i18n/ja.js"></script>
<script src="../region/i18n.js"></script>

<!-- プロフィール編集 (カードの編集とは別。いまはスマッチのレートをルールごとに出すかどうか)。中身は src/pages/p_profile.js -->
<main class="pf">
  <div id="loading" class="empty-msg" data-i18n="common.loading">読み込み中…</div>
  <div id="not-found" class="empty-msg" style="display:none" data-i18n="player.not_found">プレイヤーが見つかりません。URL を確認してください。</div>

  <div id="pf-root" style="display:none">
    <a class="ce-back" id="pf-back" href="./">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      <span data-i18n="profile.back">プレイヤーページに戻る</span>
    </a>
    <h1 data-i18n="profile.title">プロフィール編集</h1>
    <p class="pf-name" id="pf-name"></p>

    <!-- ログアウト中: ログインのボタン。別の人でログイン中: 注意と「自分のプロフィールを編集」 -->
    <div class="ce-gate" id="pf-gate" style="display:none">
      <div class="ce-gate-msg" id="pf-gate-msg"></div>
      <button type="button" class="ce-login" id="pf-login-btn" data-i18n="card_edit.login">start.gg でログイン</button>
      <a class="ce-login" id="pf-mine-btn" href="profile.html" style="display:none" data-i18n="profile.edit_mine">自分のプロフィールを編集</a>
    </div>

    <div id="pf-form" style="display:none">
      <section class="pf-sec">
        <h2 data-i18n="profile.card.title">プレイヤーカード</h2>
        <p data-i18n="profile.card.body">カードの色・二つ名・実績・裏面のシールを変えられます。</p>
        <a class="pf-go" id="pf-card" href="edit.html" data-i18n="profile.card.go">カードを編集</a>
      </section>

      <section class="pf-sec" id="pf-smatch-sec">
        <h2><span data-i18n="profile.smatch.title">スマッチ</span><span class="pf-chip" id="pf-smatch-chip"></span></h2>
        <p data-i18n="profile.smatch.body">スマッチ (オンラインのレート対戦サイト) で start.gg を連携していると、レートがプレイヤーページに出ます。</p>
        <label class="pf-switch">
          <span data-i18n="profile.smatch.show_1on1">1on1 のレートを表示する</span>
          <input type="checkbox" id="pf-smatch-show-1on1" data-key="smatch_1on1" disabled>
          <span class="pf-track" aria-hidden="true"></span>
        </label>
        <label class="pf-switch">
          <span data-i18n="profile.smatch.show_tokuoma">特おまのレートを表示する</span>
          <input type="checkbox" id="pf-smatch-show-tokuoma" data-key="smatch_tokuoma" disabled>
          <span class="pf-track" aria-hidden="true"></span>
        </label>
        <div class="pf-status" id="pf-status" role="status"></div>
        <p class="pf-note" id="pf-smatch-note" style="display:none" data-i18n="profile.smatch.unlinked_note">スマッチ側で start.gg を連携すると、翌日からここに出ます。</p>
      </section>
    </div>
  </div>
</main>

<script src="../assets/p_profile.js"></script>
</body>
</html>
