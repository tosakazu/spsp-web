<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.p_edit.title">カードを編集 | SPSP</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../css/player.css">
<link rel="stylesheet" href="../css/player_card.css">
<link rel="stylesheet" href="../css/card_edit.css">
<link rel="stylesheet" href="../css/holo_badge.css">
<link rel="stylesheet" href="../css/badge_edit.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@500;600;700&family=Zalando+Sans+Expanded:ital,wght@0,400;0,500;0,600;0,700;1,800&family=Zalando+Sans:ital,wght@0,500..900;1,900&display=swap">
<link rel="stylesheet" href="../region/site.css">
</head>
<body>

<div id="nav-root"></div>
<script src="../region/config.js"></script>
<script src="../i18n/ja.js"></script>
<script src="../region/i18n.js"></script>

<!-- プレイヤーカードの編集 (テンプレート・色・実績)。中身は src/pages/p_edit.js -->
<main class="ce">
  <div id="loading" class="empty-msg" data-i18n="common.loading">読み込み中…</div>
  <div id="not-found" class="empty-msg" style="display:none" data-i18n="player.not_found">プレイヤーが見つかりません。URL を確認してください。</div>

  <div id="ce-root" style="display:none">
    <a class="ce-back" id="ce-back" href="./">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      <span data-i18n="card_edit.back_mypage">マイページに戻る</span>
    </a>

    <!-- 表と裏の編集の切り替え (本人と確認できたら出す) -->
    <div class="ce-tabs" id="ce-tabs" role="tablist" style="display:none">
      <button type="button" role="tab" data-tab="front" class="on" aria-selected="true">表</button>
      <button type="button" role="tab" data-tab="back" aria-selected="false">裏</button>
    </div>

    <!-- 表の道具の行 (裏の道具の行と同じ高さ。カードの位置をそろえて、裏返しのときにずれないように) -->
    <div class="ce-front-head" id="ce-front-head" style="display:none">
      <button type="button" class="ce-default" id="ce-default" data-i18n="card_edit.default">デフォルトに戻す</button>
    </div>

    <!-- プレビュー: 表と裏 (英字名を入力している間・プレビューを押したときは裏面を見せる) -->
    <div class="ce-preview" id="ce-preview"><div class="pcard-flip"><div class="pcard" id="ce-card"></div><div class="pcard pcard-back" id="ce-card-back" aria-hidden="true"></div></div></div>

    <!-- ログインして本人と確認できたら編集できる (いまは spsp.games でだけ確認する。確認用のプレビューでは素通し) -->
    <div class="ce-gate" id="ce-gate" style="display:none">
      <!-- ログアウト中: ログインのボタン。別の人でログイン中: 注意と「自分のカードを編集」 -->
      <div class="ce-gate-msg" id="ce-gate-msg"></div>
      <button type="button" class="ce-login" id="ce-login-btn" data-i18n="card_edit.login">start.gg でログイン</button>
      <a class="ce-login" id="ce-mine-btn" href="edit.html" style="display:none" data-i18n="card_edit.edit_mine">自分のカードを編集</a>
    </div>

    <div id="ce-form" style="display:none">
      <!-- 表: テンプレート・色・二つ名・実績・大会 -->
      <div id="ce-pane-front">
      <section class="ce-sec">
        <h2 data-i18n="card_edit.template">テンプレート</h2>
        <div class="ce-templates" id="ce-templates"></div>
      </section>
      <section class="ce-sec">
        <h2 data-i18n="card_edit.color">カラー</h2>
        <div class="ce-colors" id="ce-colors"></div>
      </section>
      <!-- 二つ名: 前半・後半を、持っているものから選ぶ (「なし」も可)。新しく獲得したものに NEW (js/titles.js・js/title_notice.js) -->
      <section class="ce-sec" id="ce-title-sec">
        <h2 data-i18n="card_edit.title">二つ名</h2>
        <!-- 前半・後半それぞれ縦に回すリール (真ん中の帯に止まったものを選ぶ。項目を押すとそこまで回る) -->
        <div class="ce-reels">
          <div class="ce-reel-col"><div class="ce-reel-lbl" data-i18n="card_edit.title_pre">前半</div>
            <div class="ce-reel"><div class="ce-reel-band" aria-hidden="true"></div><div class="ce-reel-scroll" id="ce-title-pre" role="listbox" tabindex="0" data-i18n-attr="aria-label:card_edit.title_pre"></div></div></div>
          <div class="ce-reel-col"><div class="ce-reel-lbl" data-i18n="card_edit.title_post">後半</div>
            <div class="ce-reel"><div class="ce-reel-band" aria-hidden="true"></div><div class="ce-reel-scroll" id="ce-title-post" role="listbox" tabindex="0" data-i18n-attr="aria-label:card_edit.title_post"></div></div></div>
        </div>
        <div class="ce-title-note" id="ce-title-note"></div>
      </section>
      <!-- 実績と大会は最初は畳んでおく (見出しの右に今の選択) -->
      <details class="ce-sec ce-fold">
        <summary><h2>
          <span data-i18n="card_edit.achievements">実績</span>
          <!-- リセットは見出しのすぐ右 (隠れていても場所を取るので、右端の「自動」を大会の行とそろえるため) -->
          <button type="button" class="ce-reset" id="ce-reset" data-i18n-attr="title:card_edit.reset,aria-label:card_edit.reset" title="リセット" aria-label="リセット">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
          </button>
          <span class="ce-fold-sum" id="ce-ach-sum"></span>
          <svg class="ce-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </h2></summary>
        <div class="ce-achs" id="ce-achs"></div>
      </details>
      <!-- カード左下に出す大会: 並べ替え (日付 / ポイント / ポイント (減衰なし)) と検索。先頭の「自動」= ポイントが一番高い大会 -->
      <details class="ce-sec ce-fold">
        <summary><h2><span data-i18n="card_edit.tour">大会</span><span class="ce-fold-sum" id="ce-tour-sum"></span><svg class="ce-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></h2></summary>
        <div class="ce-tour-tools">
          <div class="ce-seg" id="ce-tour-sort" role="tablist">
            <button type="button" data-sort="date" class="on" data-i18n="card_edit.sort.date">日付</button>
            <button type="button" data-sort="pts" data-i18n="card_edit.sort.pts">ポイント</button>
            <button type="button" data-sort="raw" data-i18n="card_edit.sort.raw">ポイント (減衰なし)</button>
          </div>
          <input type="search" class="ce-tour-q" id="ce-tour-q" placeholder="大会名で検索" data-i18n-attr="placeholder:card_edit.tour_search" autocomplete="off">
        </div>
        <div class="ce-tours" id="ce-tours"></div>
      </details>
      </div>
      <!-- 裏: 裏面の名前とシール (src/pages/card_back_edit.js、裏のタブを初めて開いたときに組み立てる) -->
      <div class="ce-pane-back" id="ce-pane-back" style="display:none">
        <!-- 道具の行: 裏面の名前 (英字名、カードの設定 latin。最初から今の名前 = 未設定なら名前から自動で作ったものが入っている) と、
             元に戻す・文字を前に・白フチ・その他 (やり直すはその他の中) -->
        <div class="bz-head">
          <input type="text" class="bz-latin" id="bz-latin" maxlength="45" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="latin" enterkeyhint="done" aria-label="裏面の名前" title="裏面の名前">
          <div class="bz-head-btns">
        <button type="button" class="bz-ib" id="bz-undo" title="元に戻す (Ctrl+Z)" aria-label="元に戻す" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <!-- 名前・二つ名・順位をシールの上に (絵: シールの四角の手前に A) -->
        <button type="button" class="bz-ib bz-tt" id="bz-text-top" aria-pressed="false" title="名前・二つ名・順位をシールの上に出す" aria-label="名前・二つ名・順位をシールの上に出す">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="bz-tt-st" x="9" y="3" width="12" height="12" rx="2.5"/><path class="bz-tt-a" d="M3.5 21L8.5 8.5h1.6L15 21M5.4 16.6h7.8"/><rect class="bz-tt-st bz-tt-over" x="9" y="3" width="12" height="12" rx="2.5"/></svg>
        </button>
        <!-- 名前・二つ名・順位を白フチのシールに (絵: 白い太い縁の A) -->
        <button type="button" class="bz-ib bz-tt bz-sx" id="bz-sticker-text" aria-pressed="false" title="名前・二つ名・順位を白フチのシールにする" aria-label="名前・二つ名・順位を白フチのシールにする">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="bz-sx-out" d="M4.5 20.5L10.6 5h2.8l6.1 15.5M7 15.2h10"/><path class="bz-sx-in" d="M4.5 20.5L10.6 5h2.8l6.1 15.5M7 15.2h10"/></svg>
        </button>
            <details class="bz-menu" id="bz-menu">
              <summary class="bz-ib" title="その他" aria-label="その他"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></summary>
              <div class="bz-menu-pop">
                <button type="button" class="bz-menu-redo" id="bz-redo" title="Ctrl+Shift+Z" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>やり直す</button>
                <!-- 名前・二つ名・順位 (カードの上でドラッグして動かせる) を真ん中に戻す -->
                <button type="button" class="bz-menu-redo" id="bz-text-center" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>名前を真ん中に戻す</button>
                <!-- まだ貼っていないシールのある大会 (下位クラスも同じ大会) から k 大会を選び (その大会で残っている一番上のもの)、ランダムな大きさ・場所・角度・形で貼る (k は − / + で) -->
                <div class="bz-rand">
                  <button type="button" class="bz-rand-go" id="bz-rand">ランダムに <b id="bz-rand-k">5</b> 枚貼る</button>
                  <button type="button" class="bz-rand-step" id="bz-rand-minus" aria-label="1 枚減らす">−</button>
                  <button type="button" class="bz-rand-step" id="bz-rand-plus" aria-label="1 枚増やす">+</button>
                </div>
                <button type="button" class="bz-danger" id="bz-clear">シールを全部剥がす</button>
              </div>
            </details>
          </div>
        </div>
        <!-- 名前に使えない文字があるときだけ理由 -->
        <div class="bz-name-note" id="bz-latin-note"></div>
    <!-- カードと操作。操作の欄は選んでいてもいなくても同じ高さ (一覧がずれないように) -->
    <div class="bz-top" id="bz-top">
      <div class="bz-stage" id="bz-stage">
        <div class="pcard pcard-back" id="bz-card" aria-hidden="true"></div>
        <div class="bz-layer" id="bz-layer"></div>
        <!-- 名前・二つ名・順位をシールの上に出すとき: 裏面をもう 1 枚描き、文字の所だけ見せる -->
        <div class="pcard pcard-back bz-text" id="bz-text" aria-hidden="true" style="display:none"></div>
        <div class="bz-over" id="bz-over"><div class="bz-frame" id="bz-frame" style="display:none"><span class="bz-h bz-h-rot" title="回転・大きさ">↻</span><span class="bz-h bz-h-del" title="剥がす">×</span></div></div>
      </div>

      <div class="bz-tools" id="bz-tools">
        <div class="bz-sel-name" id="bz-sel-name"></div>
        <div class="bz-row">
          <div class="bz-seg bz-shapes" id="bz-shapes" role="group" aria-label="形">
            <button type="button" data-k="square" title="四角"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14"/></svg></button>
            <button type="button" data-k="round" title="角丸"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="3.5"/></svg></button>
            <button type="button" data-k="circle" title="丸"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/></svg></button>
            <button type="button" data-k="hex" title="六角形"><svg viewBox="0 0 20 20"><polygon points="10,2.5 16.5,6.25 16.5,13.75 10,17.5 3.5,13.75 3.5,6.25"/></svg></button>
            <button type="button" data-k="diamond" title="ひし形"><svg viewBox="0 0 20 20"><polygon points="10,2 18,10 10,18 2,10"/></svg></button>
          </div>
          <div class="bz-seg bz-order" role="group" aria-label="重なり順">
            <button type="button" id="bz-backmost" title="いちばん下へ"><svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg></button>
            <button type="button" id="bz-down" title="1 つ下へ"><svg viewBox="0 0 24 24"><path d="M12 5v14M7 14l5 5 5-5"/></svg></button>
            <button type="button" id="bz-up" title="1 つ上へ"><svg viewBox="0 0 24 24"><path d="M12 19V5M7 10l5-5 5 5"/></svg></button>
            <button type="button" id="bz-front" title="いちばん上へ"><svg viewBox="0 0 24 24"><path d="M12 20V8M7 13l5-5 5 5M5 4h14"/></svg></button>
          </div>
          <button type="button" class="bz-ib bz-del" id="bz-del" title="剥がす (Delete)" aria-label="剥がす"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        </div>
        <div class="bz-row">
          <div class="bz-seg bz-tabs" id="bz-tabs" role="tablist">
            <button type="button" data-t="size" class="on">大きさ</button>
            <button type="button" data-t="rot">回転</button>
            <button type="button" data-t="crop">切り取り</button>
          </div>
          <input type="range" class="bz-slider" id="bz-slider" aria-label="大きさ">
          <button type="button" class="bz-val" id="bz-val" title="元に戻す"></button>
        </div>
      </div>
    </div>
    <section class="bz-sec">
      <div class="bz-find">
        <label class="bz-q"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input type="search" id="bz-q" placeholder="大会名・シリーズで探す" autocomplete="off" enterkeyhint="search"></label>
        <select id="bz-series" aria-label="シリーズ" disabled><option value="">シリーズ: すべて</option></select>
        <select id="bz-sort" aria-label="並べ替え">
          <option value="new">新しい順</option>
          <option value="old">古い順</option>
          <option value="pts">順位評価ポイント順</option>
          <option value="place">順位順</option>
          <option value="nent">参加人数順</option>
        </select>
      </div>
      <div class="bz-filters" id="bz-filters">
        <button type="button" data-f="all" class="on">全部</button>
        <button type="button" data-f="r">虹</button>
        <button type="button" data-f="g">金</button>
        <button type="button" data-f="s">銀</button>
        <button type="button" data-f="n">素</button>
        <button type="button" data-f="placed">貼付中</button>
      </div>
      <!-- 一覧はページごとスクロールする (カード・操作・絞り込みも流れて隠れる。シールを押すと上へ戻る) -->
      <div class="bz-scroll" id="bz-scroll">
        <div class="bz-tray" id="bz-tray"></div>
        <button type="button" class="bz-more" id="bz-more" style="display:none">もっと見る</button>
        <div class="bz-note">1 つの大会につき、取った色から下の色まで全部持っています (虹 = 優勝、金・銀 = 上位、素 = 参加。素はホロなし)。大会を押すといちばん上の色を、色の丸を押すとその色を貼ります。アイコンのある大会だけ出ます。</div>
      </div>
    </section>
      </div>
      <div class="ce-bar">
        <button type="button" class="ce-apply" id="ce-apply" data-i18n="card_edit.apply">適用</button>
      </div>
    </div>
  </div>
</main>

<script src="../assets/p_edit.js"></script>
</body>
</html>
