<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 告知画像の撮影用: 日本語は Noto Sans CJK JP (中国語の字形にしない)。iPhone の Hiragino Sans の代わり -->
  <match target="pattern"><edit name="lang" mode="assign"><string>ja</string></edit></match>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Noto Sans CJK JP</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>Hiragino Sans</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>-apple-system</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>Helvetica Neue</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>Arial</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Noto Sans Mono CJK JP</family></prefer></alias>
</fontconfig>
