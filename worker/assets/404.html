<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません — SPSP</title>
<style>
  :root { color-scheme: light dark; --fg: #111827; --sub: #4b5563; --bg: #ffffff; --accent: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f3f4f6; --sub: #9ca3af; --bg: #111827; --accent: #f87171; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.7; }
  main { max-width: 560px; margin: 14vh auto 0; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  a { color: var(--accent); font-weight: 600; }
  .en { color: var(--sub); font-size: 14px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>ページが見つかりません</h1>
  <p>URL が間違っているか、ページが移動・削除された可能性があります。</p>
  <p><a href="/jp/">SPSP のトップへ</a></p>
  <p class="en">Page not found. <a href="/jp/?lang=en">Go to the SPSP top page</a> (<a href="/na/">North America</a>).</p>
</main>
</body>
</html>
